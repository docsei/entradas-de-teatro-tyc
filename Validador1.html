<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
  html, body {
    margin: 0;
    padding: 0;
  }
  .card-wrap {
    max-width: 560px;
    width: 100%;
    margin: 40px auto;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
    border-radius: 12px;
    overflow: hidden;
    border: 0.5px solid #e5e7eb;
  }
  .card-wrap * { box-sizing: border-box; }
  .card-img {
    display: block;
    width: 100%;
    height: auto;
  }
  #validador {
    background: #fff;
    width: 100%;
    padding: clamp(20px, 4vw, 32px);
  }
  #validador .acc-label {
    display: block;
    font-size: clamp(12px, 2vw, 13px);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #6b7280;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #acc-input {
    width: 100%;
    padding: clamp(12px, 2.5vw, 16px) 14px;
    font-family: 'Poppins', sans-serif;
    font-size: clamp(15px, 3vw, 17px);
    font-weight: 600;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    color: #111827;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    margin-bottom: 12px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #acc-input::placeholder {
    font-weight: 400;
    letter-spacing: 0.3px;
    color: #9ca3af;
    text-transform: none;
  }
  #acc-input:focus {
    border-color: #273dec;
    background: #fff;
  }
  #acc-btn {
    width: 100%;
    padding: clamp(12px, 2.5vw, 16px);
    font-family: 'Poppins', sans-serif;
    font-size: clamp(14px, 2.8vw, 16px);
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #fff;
    background: #111827;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #acc-btn:hover {
    background: #273dec;
    transform: translateY(-1px);
  }
  #acc-btn:active {
    transform: translateY(0);
  }
  #acc-btn:disabled {
    background: #9ca3af;
    cursor: default;
    transform: none;
  }
  #acc-msg {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    display: none;
    font-family: 'Poppins', sans-serif;
    font-size: clamp(12px, 2.5vw, 13px);
    font-weight: 500;
    text-align: center;
    line-height: 1.4;
  }
</style>
<div class="card-wrap">
  <img class="card-img" id="banner-img" src="" alt="Logo">
  <div id="validador">
    <label class="acc-label">Ingresa tu código de descuento</label>
    <input id="acc-input" type="text" placeholder="Ej. ABC123"
      oninput="this.value=this.value.toUpperCase()"
      onkeydown="if(event.key==='Enter')accValidar()" />
    <button id="acc-btn" onclick="accValidar()">Validar y acceder</button>
    <div id="acc-msg"></div>
  </div>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var grupo = params.get('evento') || 'default';
var presets = {
  "criolla": {
    imagen: "https://cdn.getcrowder.com/images/cfff0c25-5dcb-4a0b-b45f-154469d2b25c-banner.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/stand-up-comedy--cuenteria-multivacaciones" }
    }
  },
  "edad": {
    imagen: "https://cdn.getcrowder.com/images/77272177-c842-4656-b903-00423dee7602-banner.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/estado-de-grave-e-edad-multivacaciones" }
    }
  },
  "mago": {
    imagen: "https://cdn.getcrowder.com/images/6c9655f9-c088-46b3-b66f-99d5cc93dc7f-banner-15.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/mago-de-oz-el-musical-multivacaciones" }
    }
  },
  "magica": {
    imagen: "https://cdn.getcrowder.com/images/e33f6f4f-a2c8-493c-bc38-b118e89d8fe2-banner.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/mgica-los-mejores-magos-de-colombia-multivacaciones" },
      "MAGICA30": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/mgica-los-mejores-magos-de-colombia-30" }
    }
  },
  "viejotk": {
    imagen: "https://cdn.getcrowder.com/images/09bd2342-e3fb-4b4f-a855-3c9514109f6a-banner.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/la-gran-viejotk-tropical-multivacaciones" }
    }
  },
  "selena": {
    imagen: "https://cdn.getcrowder.com/images/9623823b-76c2-4da9-8232-f6d66a0eb71d-banner.jpg",
    codigos: {
      "ASTORCONMULTI": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/tributo-selena-como-la-flor-una-vida-hecha-cancion-multivacaciones" }
    }
  },
  "guasca": {
    imagen: "https://cdn.getcrowder.com/images/0552e861-756d-4619-9aa8-feaaed24ed39-1920x720.jpg.jpeg",
    codigos: {
      "RAFAINVITA": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/los-fantasmas-del-bronx--guasca-10" },
      "RAFAINVITA20": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/los-fantasmas-del-bronx--guasca-20" },
      "RAFAINVITA2X1": { usos: 999, usados: 0, url: "https://www.entradasdeteatro.co/event/los-fantasmas-del-bronx--guasca-2x1" }
    }
  }
};
var grupoActual = presets[grupo] || { imagen: "", codigos: {} };
var accCodigos = grupoActual.codigos;
document.getElementById("banner-img").src = grupoActual.imagen;
function accValidar() {
  var val = document.getElementById("acc-input").value.trim().toUpperCase();
  var msg = document.getElementById("acc-msg");
  var btn = document.getElementById("acc-btn");
  if (!val) {
    msg.style.display = "block"; msg.style.background = "#fef2f2"; msg.style.color = "#991b1b";
    msg.innerHTML = "Por favor ingresa un código.";
    return;
  }
  if (!accCodigos[val]) {
    msg.style.display = "block"; msg.style.background = "#fef2f2"; msg.style.color = "#991b1b";
    msg.innerHTML = "Código inválido.";
    return;
  }
  var d = accCodigos[val];
  if (d.usos - d.usados <= 0) {
    msg.style.display = "block"; msg.style.background = "#fef2f2"; msg.style.color = "#991b1b";
    msg.innerHTML = "Este código ya agotó sus usos.";
    return;
  }
  accCodigos[val].usados++;
  btn.disabled = true;
  msg.style.display = "block"; msg.style.background = "#f0fdf4"; msg.style.color = "#166534";
  msg.innerHTML = "Código válido. Redirigiendo...";
  setTimeout(function () {
    window.top.location.href = d.url;
  }, 1200);
}
</script>
