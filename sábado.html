<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sábado</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow-x:hidden; width:100%; }
  * { box-sizing:border-box; }
</style>
</head>
<body>
<div style="font-family:'DM Mono', monospace; width:100%; padding:12px 4%;">
  <div style="display:flex; flex-direction:column; gap:18px;">

      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">10:00 AM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Apertura</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Tatiana Franko</div>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">10:15 AM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Bienestar</div>

      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">11:30 AM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Redes Sociales</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Por confirmar</div>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">1:30 PM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Marca Personal</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Santiago Reyes</div>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">2:45 PM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Finanzas</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Paola Sanchez</div>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">4:00 PM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Emprendimiento</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Karen Carvajalino</div>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div style="min-width:70px; color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">5:15 PM</div>
      <div style="min-width:0;">
        <div style="color:#d5ed3d; font-weight:700; font-size:clamp(12px,1.6vw,15px);">Cierre</div>
        <div style="color:#ffffff; font-size:clamp(11px,1.4vw,14px);">Tatiana Franko</div>
      </div>
    </div>

</html>
